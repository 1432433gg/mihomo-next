services:
  reader:
    depends_on:
      remote-webview:
        condition: service_started

  renderer-net:
    image: &reader_image ghcr.io/1432433gg/reader-next:{{READER_VERSION}}
    command: ["egress"]
    user: "0:0"
    restart: always
    cap_drop: ["ALL"]
    cap_add: ["NET_ADMIN"]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - remote-webview.env
    networks:
      default:
        aliases: ["remote-webview"]
    expose: ["8050"]
    healthcheck:
      test: ["CMD", "test", "-f", "/run/egress-ready"]
      interval: 2s
      timeout: 1s
      retries: 15
    logging:
      driver: none

  remote-webview:
    image: *reader_image
    command: ["webview"]
    restart: always
    network_mode: "service:renderer-net"
    depends_on:
      renderer-net:
        condition: service_healthy
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    shm_size: "256m"
    healthcheck:
      disable: true
    logging:
      driver: none
